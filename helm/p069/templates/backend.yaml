apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: backend
    {{- include "p069.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.backend.secrets.databaseUrl | quote }}
  ENCRYPTION_KEY: {{ .Values.backend.secrets.encryptionKey | quote }}
  OPENAI_API_KEY: {{ .Values.backend.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.backend.secrets.anthropicApiKey | quote }}
  GROQ_API_KEY: {{ .Values.backend.secrets.groqApiKey | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    {{- include "p069.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["sh", "-c", "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port {{ .Values.backend.port }}"]
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - secretRef:
                name: backend-secret
          env:
            - name: APP_ENV
              value: {{ .Values.global.appEnv | quote }}
            - name: APP_PORT
              value: {{ .Values.backend.port | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.backend.corsOrigins | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    {{- include "p069.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
