name: Build & Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Nhánh cần deploy (main / production)"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================
  # JOB 1: BUILD DOCKER IMAGES TRÊN GITHUB RUNNER & PUSH GHCR
  # ==========================================================
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_meta.outputs.tag }}
      owner: ${{ steps.set_meta.outputs.owner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare lowercase repo owner & tag
        id: set_meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.sha }}"
          echo "owner=$OWNER_LC" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Owner (lowercase): $OWNER_LC"
          echo "Building with tag: $TAG"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build & Push Backend ---
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.set_meta.outputs.owner }}/p069-backend:latest
            ghcr.io/${{ steps.set_meta.outputs.owner }}/p069-backend:${{ steps.set_meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build & Push Frontend ---
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://140.245.58.162
          push: true
          tags: |
            ghcr.io/${{ steps.set_meta.outputs.owner }}/p069-frontend:latest
            ghcr.io/${{ steps.set_meta.outputs.owner }}/p069-frontend:${{ steps.set_meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # JOB 2: DEPLOY LÊN KUBERNETES TRÊN VPS QUA HELM
  # ==========================================================
  deploy-k8s:
    name: Deploy to K3s via Helm
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            echo "🚀 [1/3] Cập nhật mã nguồn & Helm Chart trên VPS..."
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/ubuntu/P-069' }}"
            DEPLOY_DIR="${DEPLOY_DIR/#\~/$HOME}"
            cd "$DEPLOY_DIR"

            BRANCH_NAME="${{ github.event.inputs.target_branch || github.event.workflow_run.head_branch || 'main' }}"
            git fetch origin
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME"

            echo "☸️ [2/3] Cập nhật bản phát hành Helm với Image mới..."
            export KUBECONFIG=~/.kube/config
            OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            helm upgrade --install p069 ./helm/p069 \
              --set backend.image.repository="ghcr.io/$OWNER_LOWER/p069-backend" \
              --set backend.image.tag="$IMAGE_TAG" \
              --set backend.image.pullPolicy="Always" \
              --set frontend.image.repository="ghcr.io/$OWNER_LOWER/p069-frontend" \
              --set frontend.image.tag="$IMAGE_TAG" \
              --set frontend.image.pullPolicy="Always"

            echo "🩺 [3/3] Trạng thái Pods sau khi cập nhật:"
            kubectl rollout status deployment/backend --timeout=60s || true
            kubectl rollout status deployment/frontend --timeout=60s || true
            kubectl get pods
            echo "✅ Deployment lên Kubernetes hoàn tất thành công!"
