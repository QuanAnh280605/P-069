name: Build & Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Nhánh cần deploy (main / production)"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================
  # JOB 1A: BUILD BACKEND (CHẠY SONG SONG)
  # ==========================================================
  build-backend:
    name: Build & Push Backend to OCIR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: xsp.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            xsp.ocir.io/ax2il7nx7xmg/p069-backend:latest
            xsp.ocir.io/ax2il7nx7xmg/p069-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # JOB 1B: BUILD FRONTEND (CHẠY SONG SONG CÙNG BACKEND)
  # ==========================================================
  build-frontend:
    name: Build & Push Frontend to OCIR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: xsp.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://140.245.58.162
          push: true
          tags: |
            xsp.ocir.io/ax2il7nx7xmg/p069-frontend:latest
            xsp.ocir.io/ax2il7nx7xmg/p069-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # JOB 2: CẬP NHẬT GITOPS MANIFEST TRÊN REPO CLOUD-INFRA
  # ==========================================================
  update-gitops:
    name: Update Image Tag in cloud-infra (GitOps)
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cloud-infra repository
        uses: actions/checkout@v4
        with:
          repository: QuanAnh280605/cloud-infra
          token: ${{ secrets.GITOPS_PAT }}
          path: cloud-infra

      - name: Update Image Tags in values.yaml
        run: |
          IMAGE_TAG="${{ github.sha }}"
          VALUES_FILE="cloud-infra/apps/p069/values.yaml"
          
          echo "Updating $VALUES_FILE with tag: $IMAGE_TAG..."
          
          # Cập nhật trường tag của backend và frontend
          sed -i.bak -E "/backend:/,/frontend:/ s/(tag: ).*/\1\"$IMAGE_TAG\"/" "$VALUES_FILE"
          sed -i.bak -E "/frontend:/,/ingress:/ s/(tag: ).*/\1\"$IMAGE_TAG\"/" "$VALUES_FILE"
          rm -f "$VALUES_FILE.bak"
          
          echo "Cấu hình sau khi cập nhật:"
          grep -E "tag: " "$VALUES_FILE"

      - name: Commit and Push new Image Tag to cloud-infra
        run: |
          cd cloud-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps/p069/values.yaml
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào về image tag."
          else
            git commit -m "deploy(p069): update image tag to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "✅ Đã push commit cập nhật phiên bản lên cloud-infra thành công!"
            echo "🚀 ArgoCD sẽ tự động đồng bộ và rollout bản cập nhật trong giây lát."
          fi

      - name: Send Deployment Notification (Teams / Telegram)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="🚀"
            TEXT="✅ **P-069 Image Build & GitOps Trigger Thành Công**\n- **Nhánh**: \`${{ github.ref_name }}\`\n- **Image Tag**: \`${{ github.sha }}\`\n- **Trạng thái**: Đã cập nhật tag vào repo cloud-infra, ArgoCD đang tự động rollout lên cụm K3s!"
          else
            EMOJI="🚨"
            TEXT="❌ **P-069 CI/CD Thất Bại**\n- **Nhánh**: \`${{ github.ref_name }}\`\n- **Commit**: \`${{ github.sha }}\`\n- Vui lòng kiểm tra GitHub Actions logs!"
          fi

          # Microsoft Teams Webhook
          if [ -n "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "📢 Đang gửi thông báo tới Microsoft Teams..."
            curl -s -H "Content-Type: application/json" \
              -d "{\"title\": \"$EMOJI P-069 CI/CD Alert\", \"text\": \"$TEXT\"}" \
              "${{ secrets.TEAMS_WEBHOOK_URL }}" || true
          fi

          # Telegram Bot
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "📢 Đang gửi thông báo tới Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=Markdown" \
              -d "text=$TEXT" || true
          fi
